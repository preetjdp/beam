name: WAN-tuned package release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate, tag, and publish
        required: true
        default: 0.3.26+wan.1
  push:
    branches:
      - codex/wan-tuned-package
    tags:
      - "v*+wan.*"

permissions:
  contents: write

concurrency:
  group: wan-package-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/wan-tuned-package'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/wan-tuned-package
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev libpam0g-dev libclang-dev xclip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Release through the repository gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B codex/wan-tuned-package
          git push --set-upstream origin codex/wan-tuned-package
          make release VERSION='${{ inputs.version || '0.3.26+wan.1' }}'

  build-test-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system and packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev libpam0g-dev libclang-dev xclip \
            dpkg-dev apt-utils gnupg curl
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq nfpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Verify version and run full CI
        run: |
          make version-check
          make ci

      - name: Build release package
        run: |
          cargo build --release --workspace
          mkdir -p staging/usr/local/bin staging/usr/share/beam/web/dist
          cp target/release/beam-server target/release/beam-agent staging/usr/local/bin/
          cp scripts/beam-doctor staging/usr/local/bin/
          chmod 755 staging/usr/local/bin/*
          cp -r web/dist/* staging/usr/share/beam/web/dist/
          VERSION=$(grep -A5 '^\[workspace.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
          export VERSION ARCH=amd64
          nfpm package --config packaging/nfpm.yaml --packager deb \
            --target "beam_${VERSION}_amd64.deb"
          dpkg-deb --info "beam_${VERSION}_amd64.deb"
          dpkg-deb --contents "beam_${VERSION}_amd64.deb" | grep -E \
            'usr/local/bin/beam-(server|agent)|usr/share/beam/web/dist/index.html'

      - name: Publish signed APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-keys --with-colons | awk -F: '$1 == "pub" {print $5; exit}')
          mkdir -p apt-repo/pool/main/b/beam apt-repo/gpg
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          cp beam_*_amd64.deb apt-repo/pool/main/b/beam/
          cd apt-repo
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k dists/stable/main/binary-amd64/Packages
          cd dists/stable
          apt-ftparchive \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Suite="stable" \
            release . > Release
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --armor --clearsign --output InRelease Release
          cd ../..
          gpg --armor --export "$GPG_KEY_ID" > gpg/beam.gpg
          touch .nojekyll
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b gh-pages
          git add -A
          git commit -m "Publish ${GITHUB_REF_NAME}"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" beam_*_amd64.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "Beam ${GITHUB_REF_NAME} (WAN tuned)" \
            --notes 'Deployment package with congestion-drop IDR recovery and the x264 veryfast preset.'
