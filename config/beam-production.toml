# Beam Remote Desktop Configuration (Production)
# Edit freely — package upgrades will NOT overwrite your changes.

[server]
bind = "0.0.0.0"
port = 8444
web_root = "/usr/share/beam/web/dist"
# tls_cert = "/etc/beam/cert.pem"    # Auto-generated self-signed if absent
# tls_key = "/etc/beam/key.pem"      # Auto-generated self-signed if absent
# client_metrics_enabled = false     # Opt-in browser connection-quality metrics

[observability]
# sentry_dsn = ""                    # Empty/absent disables browser error reporting
# sentry_traces_sample_rate = 0.0    # 0.0 to 1.0
# sentry_environment = "production"

[video]
# Measured software/WAN starting profile. Keep hardware/LAN experiments in a
# separate treatment rather than silently applying the repository's 50 Mbps default.
bitrate = 15000     # kbps (initial target)
min_bitrate = 4000  # kbps (adaptive lower bound)
max_bitrate = 20000 # kbps (adaptive upper bound)
framerate = 60
max_pixels = 8294400
max_dpr = 2.0
hidpi_enabled = false          # observe DPR intent first; enable after host benchmark
h264_profile = "main"          # auto|main|high; High requires client negotiation
x264_preset = "veryfast"
frame_header_version = 1       # v2 only after client capability negotiation
treatment_id = "software-wan"
media_transport = "websocket"
capture_mode = "fixed_rate"
congestion_mode = "off"
decode_low_watermark = 1
decode_high_watermark = 3
max_frame_age_ms = 150
telemetry_sample_every = 0
fec_group_size = 0
# encoder = "nvh264enc"  # Auto-detected if absent: nvh264enc > vah264enc > x264enc

[audio]
enabled = true
bitrate = 128       # kbps (Opus)

[session]
default_width = 1920
default_height = 1080
display_start = 10
max_sessions = 8
# gpu_driver = "auto"  # "auto" (detect GPU), "nvidia" (force GPU), "dummy" (force software)
